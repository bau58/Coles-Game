<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Héctor & Nicole - Rhine Journey</title>
    <!-- Importing Roboto and Bebas Neue -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            background-color: #1a1a1a;
            user-select: none;
            -webkit-user-select: none;
        }

        /* The iPhone 17 Pastel Green Header - Mobile First */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(213, 229, 213, 0.95); 
            color: #1e3a24; 
            text-align: center;
            padding: 10px 0;
            z-index: 50; 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .couple-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem; /* Scaled down for mobile */
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }

        .clocks {
            font-size: 0.7rem; /* Scaled down for mobile */
            color: #2c4a33;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            gap: 15px;
            font-weight: bold;
        }

        /* Full Screen Background */
        #content-container {
            position: relative;
            /* 100dvh prevents background jumping on mobile browsers */
            height: 100vh;
            height: 100dvh; 
            width: 100vw;
            background-image: url('ColeyHector.png'); 
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 60px; /* Offset to keep it below header */
            box-sizing: border-box;
        }

        /* Minimalist Calendar Container */
        #calendar-wrapper {
            background: rgba(20, 20, 20, 0.4); 
            backdrop-filter: blur(8px);
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            width: 85%;
            max-width: 400px;
            transform: translateY(-10vh); /* Pushes the calendar higher */
        }

        #calendar-wrapper h1 {
            font-family: 'Bebas Neue', sans-serif;
            color: white;
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5); 
        }

        /* 4x2 Grid for the 8 days */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            border-top: 1px solid rgba(255,255,255,0.2);
            border-left: 1px solid rgba(255,255,255,0.2);
        }

        .day-card {
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(255,255,255,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .day-card:active {
            background: rgba(255,255,255,0.1);
        }

        .day-num {
            font-size: 1.8rem;
            font-weight: 300;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .day-loc {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            color: #bdc3c7;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .locked {
            opacity: 0.35;
        }

        /* The custom Alert Modal */
        #alert-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .alert-box {
            background: #1a1a1a;
            color: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            width: 70%;
            max-width: 300px;
        }

        .alert-box h3 {
            margin: 0 0 15px 0;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .alert-btn {
            background: white;
            color: black;
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            border-radius: 5px;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="couple-name">Héctor + Nicole <span style="font-family: -apple-system, Arial, sans-serif;">&#8734;&#xFE0E;</span></div>
        <div class="clocks">
            <span>My time: <span id="mx-time">--:--:--</span></span>
            <span>Your time: <span id="eu-time">--:--:--</span></span>
        </div>
    </div>

    <div id="content-container">
        <div id="calendar-wrapper">
            <h1>JUNE</h1>
            <div class="calendar-grid" id="calendar-grid">
                <div class="day-card" data-day="17">
                    <span class="day-num">17</span>
                    <span class="day-loc">KIND</span>
                </div>
                <div class="day-card" data-day="18">
                    <span class="day-num">18</span>
                    <span class="day-loc">COLN</span>
                </div>
                <div class="day-card" data-day="19">
                    <span class="day-num">19</span>
                    <span class="day-loc">KOBL</span>
                </div>
                <div class="day-card" data-day="20">
                    <span class="day-num">20</span>
                    <span class="day-loc">SPEY</span>
                </div>
                <div class="day-card" data-day="21">
                    <span class="day-num">21</span>
                    <span class="day-loc">STRA</span>
                </div>
                <div class="day-card" data-day="22">
                    <span class="day-num">22</span>
                    <span class="day-loc">BREI</span>
                </div>
                <div class="day-card" data-day="23">
                    <span class="day-num">23</span>
                    <span class="day-loc">BASEL</span>
                </div>
                <div class="day-card" data-day="24">
                    <span class="day-num">24</span>
                    <span class="day-loc">HOME</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Pop-up for Locked Days -->
    <div id="alert-modal">
        <div class="alert-box">
            <h3> No content!</h3>
            <p style="margin-bottom: 20px;">No content</p>
            <button class="alert-btn" onclick="document.getElementById('alert-modal').style.display='none'">Okay</button>
        </div>
    </div>

    <script>
        function updateClocks() {
            const now = new Date();
            const mxOptions = { timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const euOptions = { timeZone: 'Europe/Amsterdam', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            
            document.getElementById('mx-time').innerText = now.toLocaleTimeString('en-US', mxOptions);
            document.getElementById('eu-time').innerText = now.toLocaleTimeString('en-US', euOptions);
        }
        updateClocks();
        setInterval(updateClocks, 1000);

        function setupCalendar() {
            const cestTime = new Date().toLocaleString("en-US", {timeZone: "Europe/Amsterdam"});
            const cestDate = new Date(cestTime);
            const currentMonth = cestDate.getMonth() + 1; 
            const currentDay = cestDate.getDate();

            const cards = document.querySelectorAll('.day-card');
            
            cards.forEach(card => {
                const day = parseInt(card.getAttribute('data-day'));

                // ====================================================
                // SITE PAUSED: every day is forced locked below.
                // To restore normal date-based unlocking later, delete
                // the next line and uncomment the original line under it.
                // ====================================================
                const isLocked = true;
                // const isLocked = (currentMonth === 6 && day > currentDay) || currentMonth < 6;

                if (isLocked) {
                    card.classList.add('locked');
                }

                card.addEventListener('click', () => {
                    if (isLocked) {
                        document.getElementById('alert-modal').style.display = 'flex';
                    } else {
                        window.location.href = 'june' + day + '.html';
                    }
                });
            });
        }
        
        setupCalendar();
    </script>
</body>
</html>
