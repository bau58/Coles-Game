<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>June 17 - Kinderdijk</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            background-color: #1a1a1a;
            user-select: none;
            -webkit-user-select: none;
        }

        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(30, 70, 32, 0.85); 
            color: white;
            text-align: center;
            padding: 12px 0;
            z-index: 50; 
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .couple-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 2px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .clocks {
            font-size: 0.75rem;
            color: #e2f0e3;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        #content-container {
            position: relative;
            height: 100vh;
            width: 100vw;
            background-image: url('DSF9119.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #question-box {
            text-align: center;
            background: rgba(0, 0, 0, 0.75);
            padding: 20px;
            border-radius: 12px;
            color: white;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: 75%;
            z-index: 10; 
        }

        #question-box h1 {
            font-size: 1.4rem; 
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .btn {
            font-family: 'Roboto', sans-serif;
            font-size: 1.1rem;
            padding: 10px 30px;
            margin: 0 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #btn-yes { background-color: #2ecc71; color: white; }
        #btn-no { background-color: #e74c3c; color: white; }

        #scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20; 
            cursor: pointer;
        }

        #scratch-instruction {
            position: absolute;
            bottom: 12%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 1.2rem;
            z-index: 25; 
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            pointer-events: none;
            font-weight: bold;
            transition: opacity 0.4s ease;
        }

        /* UPDATED: Full screen success screen wrapper */
        #success-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111111;
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100; 
            overflow: hidden;
        }

        /* UPDATED: Picture now stretches to cover the entire background */
        #success-screen img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* UPDATED: Message box with transparent black background */
        #success-screen h2 {
            font-size: 1.5rem;
            text-align: center;
            margin: 0 20px;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.75);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="couple-name">Héctor + Nicole ∞</div>
        <div class="clocks">
            <span>My time: <span id="mx-time">--:--:--</span></span>
            <span>Your time: <span id="eu-time">--:--:--</span></span>
        </div>
    </div>
