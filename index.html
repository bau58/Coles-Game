<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>June 17 - Kinderdijk</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            background-color: #1a1a1a;
            user-select: none;
            -webkit-user-select: none;
        }

        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(30, 70, 32, 0.85); 
            color: white;
            text-align: center;
            padding: 12px 0;
            z-index: 50; 
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .couple-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 2px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .clocks {
            font-size: 0.75rem;
            color: #e2f0e3;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        #content-container {
            position: relative;
            height: 100vh;
            width: 100vw;
            background-image: url('DSF9119.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #question-box {
            text-align: center;
            background: rgba(0, 0, 0, 0.75);
            padding: 20px;
            border-radius: 12px;
            color: white;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: 75%;
            z-index: 10; 
        }

        #question-box h1 {
            font-size: 1.4rem; 
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .btn {
            font-family: 'Roboto', sans-serif;
            font-size: 1.1rem;
            padding: 10px 30px;
            margin: 0 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        #btn-yes { background-color: #2ecc71; color: white; }
        #btn-no { background-color: #e74c3c; color: white; }

        #scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20; 
            cursor: pointer;
        }

        #scratch-instruction {
            position: absolute;
            bottom: 12%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 1.2rem;
            z-index: 25; 
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
            pointer-events: none;
            font-weight: bold;
            transition: opacity 0.4s ease;
        }

        /* UPDATED: Full screen success screen wrapper */
        #success-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111111;
            color: white;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100; 
            overflow: hidden;
        }

        /* UPDATED: Picture now stretches to cover the entire background */
        #success-screen img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* UPDATED: Message box with transparent black background */
        #success-screen h2 {
            font-size: 1.5rem;
            text-align: center;
            margin: 0 20px;
            line-height: 1.4;
            background: rgba(0, 0, 0, 0.75);
            padding: 20px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="couple-name">Héctor + Nicole ∞</div>
        <div class="clocks">
            <span>My time: <span id="mx-time">--:--:--</span></span>
            <span>Your time: <span id="eu-time">--:--:--</span></span>
        </div>
    </div>

    <div id="scratch-instruction">Scratch to reveal ✨</div>

    <canvas id="scratch-canvas"></canvas>

    <div id="content-container">
        <div id="question-box">
            <h1>¿Quieres ser mi novia?</h1>
            <button id="btn-yes" class="btn">Sí</button>
            <button id="btn-no" class="btn">No</button>
        </div>
    </div>

    <div id="success-screen">
        <img src="IMG_1430.JPEG" alt="Nosotros">
        <h2>¡Te amo! Have a good night, new game tomorrow ❤️</h2>
    </div>

    <script>
        function updateClocks() {
            const now = new Date();
            const mxOptions = { timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const euOptions = { timeZone: 'Europe/Amsterdam', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            
            document.getElementById('mx-time').innerText = now.toLocaleTimeString('en-US', mxOptions);
            document.getElementById('eu-time').innerText = now.toLocaleTimeString('en-US', euOptions);
        }
        updateClocks();
        setInterval(updateClocks, 1000);

        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const instruction = document.getElementById('scratch-instruction');
        let isDrawing = false;
        
        let scratchCount = 0; 
        let isCanvasActive = true;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            ctx.fillStyle = '#b8b8b8';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#949494';
            ctx.font = 'bold 12px "Roboto", sans-serif';
            ctx.textAlign = 'center';
            for(let i = 80; i < canvas.width; i += 180) {
                for(let j = 120; j < canvas.height; j += 160) {
                    ctx.fillText('Scratch to reveal', i, j);
                }
            }
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function scratch(e) {
            if (!isDrawing || !isCanvasActive) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(x, y, 50, 0, Math.PI * 2);
            ctx.fill();

            instruction.style.opacity = '0';

            scratchCount++;
            // UPDATED: Tripled the required amount of scratching
            if (scratchCount > 300) {
                isCanvasActive = false;
                canvas.style.transition = 'opacity 0.8s ease';
                canvas.style.opacity = '0';
                setTimeout(() => {
                    canvas.style.pointerEvents = 'none';
                }, 800);
            }
        }

        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', scratch);

        canvas.addEventListener('touchstart', () => isDrawing = true);
        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', scratch);

        const yesBtn = document.getElementById('btn-yes');
        const successScreen = document.getElementById('success-screen');

        yesBtn.addEventListener('click', () => {
            successScreen.style.display = 'flex';
        });

        document.getElementById('btn-no').addEventListener('click', () => {
            alert('Inténtalo de nuevo 😉');
        });
    </script>
</body>
</html>
