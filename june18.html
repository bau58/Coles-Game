<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>June 18 - Cologne</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            background-color: #1a1a1a;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Top Header */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(213, 229, 213, 0.95); 
            color: #1e3a24; 
            text-align: center;
            padding: 12px 0;
            z-index: 50; 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #home-btn {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #1e3a24;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.2s;
        }

        #home-btn:active {
            background: rgba(0,0,0,0.1);
        }

        .couple-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }

        .clocks {
            font-size: 0.75rem;
            color: #2c4a33;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            gap: 20px;
            font-weight: bold;
        }

        /* Main Container */
        #content-container {
            position: relative;
            height: 100vh;
            width: 100vw;
            background-image: url('June18Cologne.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 60px; /* Offset for header */
            box-sizing: border-box;
        }

        /* Overlay to make text/game readable */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        /* Screen 1: Intro */
        #intro-screen {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.75);
            padding: 30px;
            border-radius: 12px;
            color: white;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: 85%;
            transition: opacity 0.5s ease;
        }

        #intro-screen h1 {
            font-size: 1.6rem;
            margin-bottom: 25px;
            line-height: 1.3;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .btn {
            font-family: 'Roboto', sans-serif;
            font-size: 1.2rem;
            padding: 12px 35px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Screen 2: Game */
        #game-screen {
            position: relative;
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #board {
            display: grid;
            grid-template-rows: repeat(4, 1fr);
            grid-gap: 8px;
            margin-bottom: 15px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 8px;
        }

        .tile {
            width: 60px;
            height: 60px;
            border: 2px solid #565758;
            background-color: rgba(18, 18, 19, 0.85);
            color: white;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }

        /* Tile States */
        .correct { background-color: #538d4e !important; border-color: #538d4e !important; }
        .present { background-color: #b59f3b !important; border-color: #b59f3b !important; }
        .absent { background-color: #3a3a3c !important; border-color: #3a3a3c !important; }

        #clue-box {
            background: rgba(255, 255, 255, 0.9);
            color: #111;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 20px;
            width: 85%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-height: 24px;
        }

        #keyboard {
            width: 95%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .key-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .key {
            background-color: #818384;
            color: white;
            border: none;
            border-radius: 4px;
            height: 45px;
            flex: 1;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: uppercase;
            touch-action: manipulation; /* Prevents mobile double-tap zoom */
        }

        .key.large {
            flex: 1.5;
            font-size: 0.85rem;
        }

        .key:active {
            background-color: #565758;
        }

        /* Screen 3: Success */
        #success-screen {
            display: none;
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 100; 
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1s ease;
        }

        #success-screen img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            z-index: 1;
        }

        #success-screen .message-box {
            position: relative;
            z-index: 2;
            color: white;
            text-align: center;
            margin: 0 25px;
            background: rgba(0, 0, 0, 0.75);
            padding: 25px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }

        #success-screen h2 {
            font-size: 1.4rem;
            line-height: 1.5;
            margin: 0 0 15px 0;
        }
        
        #success-screen p {
            font-size: 1.1rem;
            margin: 0;
            color: #2ecc71;
            font-weight: bold;
        }

        /* Shake Animation for wrong words */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
        .shake { animation: shake 0.4s; }
    </style>
</head>
<body>

    <div id="top-bar">
        <a href="index.html" id="home-btn">&lt; Home</a>
        <div class="couple-name">Héctor + Nicole &infin;</div>
        <div class="clocks">
            <span>My time: <span id="mx-time">--:--:--</span></span>
            <span>Your time: <span id="eu-time">--:--:--</span></span>
        </div>
    </div>

    <div id="content-container">
        <div class="overlay"></div>

        <div id="intro-screen">
            <h1>Do you want to be my girlfriend?</h1>
            <button id="btn-play" class="btn">Play to Answer</button>
        </div>

        <div id="game-screen">
            <div id="clue-box">Clue: Almost, but try harder!</div>
            
            <div id="board">
                <div class="row" id="row-0">
                    <div class="tile" id="tile-0-0"></div><div class="tile" id="tile-0-1"></div><div class="tile" id="tile-0-2"></div><div class="tile" id="tile-0-3"></div>
                </div>
                <div class="row" id="row-1">
                    <div class="tile" id="tile-1-0"></div><div class="tile" id="tile-1-1"></div><div class="tile" id="tile-1-2"></div><div class="tile" id="tile-1-3"></div>
                </div>
                <div class="row" id="row-2">
                    <div class="tile" id="tile-2-0"></div><div class="tile" id="tile-2-1"></div><div class="tile" id="tile-2-2"></div><div class="tile" id="tile-2-3"></div>
                </div>
                <div class="row" id="row-3">
                    <div class="tile" id="tile-3-0"></div><div class="tile" id="tile-3-1"></div><div class="tile" id="tile-3-2"></div><div class="tile" id="tile-3-3"></div>
                </div>
            </div>

            <div id="keyboard">
                <div class="key-row">
                    <button class="key" data-key="Q">Q</button><button class="key" data-key="W">W</button><button class="key" data-key="E">E</button><button class="key" data-key="R">R</button><button class="key" data-key="T">T</button><button class="key" data-key="Y">Y</button><button class="key" data-key="U">U</button><button class="key" data-key="I">I</button><button class="key" data-key="O">O</button><button class="key" data-key="P">P</button>
                </div>
                <div class="key-row">
                    <button class="key" data-key="A">A</button><button class="key" data-key="S">S</button><button class="key" data-key="D">D</button><button class="key" data-key="F">F</button><button class="key" data-key="G">G</button><button class="key" data-key="H">H</button><button class="key" data-key="J">J</button><button class="key" data-key="K">K</button><button class="key" data-key="L">L</button>
                </div>
                <div class="key-row">
                    <button class="key large" data-key="ENTER">ENTER</button><button class="key" data-key="Z">Z</button><button class="key" data-key="X">X</button><button class="key" data-key="C">C</button><button class="key" data-key="V">V</button><button class="key" data-key="B">B</button><button class="key" data-key="N">N</button><button class="key" data-key="M">M</button><button class="key large" data-key="BACKSPACE">⌫</button>
                </div>
            </div>
        </div>
    </div>

    <div id="success-screen">
        <img src="June18.HN.JPG" alt="Nosotros">
        <div class="message-box">
            <h2>It took 632 years to finish the Cologne Cathedral..crazy!<br><br>But it's crazier that I'm going to love you even longer than that.</h2>
            <p>5ever! Enjoy your day! ❤️</p>
        </div>
    </div>

    <script>
        /* --- CLOCKS --- */
        function updateClocks() {
            const now = new Date();
            const mxOptions = { timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const euOptions = { timeZone: 'Europe/Amsterdam', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            document.getElementById('mx-time').innerText = now.toLocaleTimeString('en-US', mxOptions);
            document.getElementById('eu-time').innerText = now.toLocaleTimeString('en-US', euOptions);
        }
        updateClocks();
        setInterval(updateClocks, 1000);

        /* --- SCREEN TRANSITION --- */
        const introScreen = document.getElementById('intro-screen');
        const gameScreen = document.getElementById('game-screen');
        
        document.getElementById('btn-play').addEventListener('click', () => {
            introScreen.style.opacity = '0';
            setTimeout(() => {
                introScreen.style.display = 'none';
                gameScreen.style.display = 'flex';
                setTimeout(() => gameScreen.style.opacity = '1', 50);
            }, 500);
        });

        /* --- WORDLE GAME LOGIC --- */
        const TARGET_WORD = "SISI";
        const WORD_LENGTH = 4;
        const MAX_GUESSES = 4;
        
        let currentRow = 0;
        let currentTile = 0;
        let guesses = [
            ['', '', '', ''],
            ['', '', '', ''],
            ['', '', '', ''],
            ['', '', '', '']
        ];

        const clues = [
            "Clue: Almost, but try harder!",
            "Clue: Maybe it's in spanish?",
            "Clue: Remember I'm repetitive...",
            "Clue: Yes x 2 (in Spanish)"
        ];

        const clueBox = document.getElementById('clue-box');
        const keys = document.querySelectorAll('.key');

        keys.forEach(key => {
            key.addEventListener('click', () => {
                handleKeyPress(key.getAttribute('data-key'));
            });
        });

        function handleKeyPress(letter) {
            if (letter === 'BACKSPACE') {
                deleteLetter();
            } else if (letter === 'ENTER') {
                checkGuess();
            } else {
                addLetter(letter);
            }
        }

        function addLetter(letter) {
            if (currentTile < WORD_LENGTH && currentRow < MAX_GUESSES) {
                guesses[currentRow][currentTile] = letter;
                const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
                tile.innerText = letter;
                currentTile++;
            }
        }

        function deleteLetter() {
            if (currentTile > 0) {
                currentTile--;
                guesses[currentRow][currentTile] = '';
                const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
                tile.innerText = '';
            }
        }

        function checkGuess() {
            if (currentTile !== WORD_LENGTH) {
                // Not enough letters
                const row = document.getElementById(`row-${currentRow}`);
                row.classList.add('shake');
                setTimeout(() => row.classList.remove('shake'), 400);
                return;
            }

            const currentGuess = guesses[currentRow].join('');
            
            // Logic to color tiles
            let targetLetterCounts = {};
            for (let i = 0; i < TARGET_WORD.length; i++) {
                targetLetterCounts[TARGET_WORD[i]] = (targetLetterCounts[TARGET_WORD[i]] || 0) + 1;
            }

            const rowElement = document.getElementById(`row-${currentRow}`);
            
            // Pass 1: Find Greens (Correct)
            for (let i = 0; i < WORD_LENGTH; i++) {
                const tile = document.getElementById(`tile-${currentRow}-${i}`);
                const letter = guesses[currentRow][i];
                const keyBtn = document.querySelector(`.key[data-key="${letter}"]`);

                if (TARGET_WORD[i] === letter) {
                    tile.classList.add('correct');
                    keyBtn.classList.add('correct');
                    targetLetterCounts[letter]--;
                }
            }

            // Pass 2: Find Yellows (Present) and Grays (Absent)
            for (let i = 0; i < WORD_LENGTH; i++) {
                const tile = document.getElementById(`tile-${currentRow}-${i}`);
                const letter = guesses[currentRow][i];
                const keyBtn = document.querySelector(`.key[data-key="${letter}"]`);

                if (!tile.classList.contains('correct')) {
                    if (targetLetterCounts[letter] > 0) {
                        tile.classList.add('present');
                        if (!keyBtn.classList.contains('correct')) keyBtn.classList.add('present');
                        targetLetterCounts[letter]--;
                    } else {
                        tile.classList.add('absent');
                        if (!keyBtn.classList.contains('correct') && !keyBtn.classList.contains('present')) {
                            keyBtn.classList.add('absent');
                        }
                    }
                }
            }

            // Check Win Condition
            if (currentGuess === TARGET_WORD) {
                setTimeout(triggerWin, 800);
                return;
            }

            // Move to next row
            currentRow++;
            currentTile = 0;

            // Update Clue or Reset Last Row if failed all 4
            if (currentRow < MAX_GUESSES) {
                clueBox.innerText = clues[currentRow];
            } else {
                // Fail-safe: if she misses the 4th guess, let her retry the last row endlessly
                setTimeout(() => {
                    currentRow = 3; 
                    currentTile = 0;
                    guesses[3] = ['', '', '', ''];
                    for(let i=0; i<4; i++) {
                        let t = document.getElementById(`tile-3-${i}`);
                        t.innerText = '';
                        t.className = 'tile';
                    }
                }, 1000);
            }
        }

        function triggerWin() {
            const successScreen = document.getElementById('success-screen');
            successScreen.style.display = 'flex';
            
            // Small delay for a smooth fade-in effect
            setTimeout(() => {
                successScreen.style.opacity = '1';
            }, 50);
        }
    </script>
</body>
</html>
